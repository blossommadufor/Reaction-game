<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reflex3D // Reaction Timer Portfolio Project</title>
    <link rel="icon" type="image/jpeg" href="/favicon.jpg">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Outfit:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0F172A;
            --surface-color: #1E293B;
            --text-primary: #F1F5F9;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        h1, h2, h3 { font-family: 'Outfit', sans-serif; }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ui-layer {
            position: relative;
            z-index: 10;
            pointer-events: none;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 1rem;
        }

        .interactive { pointer-events: auto; }

        .glass-panel {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
        }

        #game-trigger {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            cursor: pointer;
            display: none; 
        }

        #instruction-overlay {
            position: fixed;
            inset: 0;
            z-index: 50;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        #instruction-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .rating-row {
            display: flex;
            justify-content: space-between;
            padding: 0.4rem 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        #score-module {
            width: 130px;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @media (min-width: 640px) {
            #score-module { width: 160px; }
            .ui-layer { padding: 1.5rem; }
        }

        .pulse-error { animation: error-shake 0.4s ease-in-out; }
        @keyframes error-shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        /* Fixed position for controls to decouple from shape */
        #center-controls {
            position: absolute;
            bottom: 25%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            pointer-events: auto;
        }
        
        .btn-glow {
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
        }
    </style>
</head>
<body>

    <!-- Instruction Board -->
    <div id="instruction-overlay">
        <div class="glass-panel p-6 sm:p-8 max-w-md w-full text-center interactive">
            <h1 class="text-2xl sm:text-3xl font-bold text-blue-400 mb-2">Reflex3D</h1>
            <p class="text-[9px] sm:text-[10px] text-slate-500 uppercase tracking-widest mb-6 font-bold">Reaction Benchmarking System</p>
            
            <div class="space-y-4 text-left">
                <div class="bg-slate-800/40 p-4 rounded-xl border border-slate-700/50">
                    <h3 class="text-[10px] font-bold text-slate-400 uppercase mb-2">Instructions</h3>
                    <div class="space-y-1 text-xs text-slate-300">
                        <p>• Click <strong class="text-blue-400">START GAME</strong> to begin.</p>
                        <p>• Shape turns <span class="text-amber-500 font-bold">ORANGE</span> during the wait.</p>
                        <p>• Tap anywhere when it flashes <span class="text-emerald-400 font-bold">GREEN</span>.</p>
                    </div>
                </div>

                <div class="bg-slate-800/40 p-4 rounded-xl border border-slate-700/50">
                    <h3 class="text-[10px] font-bold text-slate-400 uppercase mb-2">Ratings</h3>
                    <div class="text-[11px] space-y-0.5">
                        <div class="rating-row"><span class="text-emerald-400 font-semibold">Elite</span><span class="text-slate-400">&lt; 180ms</span></div>
                        <div class="rating-row"><span class="text-emerald-300">Pro</span><span class="text-slate-400">180ms - 220ms</span></div>
                        <div class="rating-row border-none"><span class="text-slate-400">Average</span><span class="text-slate-300">270ms+</span></div>
                    </div>
                </div>
            </div>

            <button id="close-instructions" class="mt-6 w-full py-4 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl transition-all transform active:scale-95 text-sm">
                INITIALIZE
            </button>
        </div>
    </div>

    <div id="canvas-container"></div>
    <div id="game-trigger"></div>

    <div class="ui-layer">
        <header class="flex justify-between items-start">
            <div class="p-2 sm:p-4">
                <h2 class="text-sm sm:text-lg font-bold text-slate-700 tracking-tighter uppercase">Reflex // 01</h2>
            </div>

            <div id="score-module" class="glass-panel p-3 sm:p-4 flex flex-col items-center justify-center interactive">
                <span class="text-[9px] sm:text-[10px] uppercase font-bold text-slate-500 tracking-widest mb-1">Result</span>
                <div class="flex items-baseline gap-1">
                    <span id="current-time" class="text-2xl sm:text-3xl font-black text-slate-400">--</span>
                    <span class="text-[9px] sm:text-[10px] font-bold text-slate-600">ms</span>
                </div>
                <span id="rating-label" class="text-[8px] sm:text-[9px] font-black uppercase tracking-tighter text-slate-500 mt-1">Standby</span>
            </div>
        </header>

        <main class="flex-grow flex flex-col items-center">
            <!-- Shape positioning is handled via Three.js (object.position.y) -->
            <!-- Controls are absolutely positioned below via CSS -->
            <div id="center-controls" class="flex flex-col items-center gap-4">
                <div class="flex gap-3">
                    <button id="start-btn" class="btn-glow px-8 py-3 bg-blue-600 hover:bg-blue-500 text-white font-black rounded-full transition-all transform active:scale-90 text-sm tracking-widest uppercase">
                        START GAME
                    </button>
                    <button id="reset-session-btn" class="px-6 py-3 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-full transition-all transform active:scale-90 text-xs tracking-widest uppercase border border-white/5">
                        RESET
                    </button>
                </div>
            </div>
        </main>

        <footer class="flex flex-col gap-3 sm:gap-4">
            <div id="error-feedback" class="text-center h-6 opacity-0 transition-opacity">
                <p class="text-red-500 font-black tracking-widest uppercase text-[10px] sm:text-[11px]">Early Input Detected</p>
            </div>

            <div class="glass-panel p-4 sm:p-5 interactive flex justify-between items-center">
                <div class="flex gap-4 sm:gap-8">
                    <div class="text-left">
                        <span class="block text-[8px] sm:text-[9px] uppercase tracking-widest text-slate-500 font-bold">AVG</span>
                        <span id="stat-avg" class="text-lg sm:text-xl font-bold text-slate-200">--</span>
                    </div>
                    <div class="text-left">
                        <span class="block text-[8px] sm:text-[9px] uppercase tracking-widest text-slate-500 font-bold">BEST</span>
                        <span id="stat-best" class="text-lg sm:text-xl font-bold text-emerald-500">--</span>
                    </div>
                    <div class="text-left">
                        <span class="block text-[8px] sm:text-[9px] uppercase tracking-widest text-slate-500 font-bold">COUNT</span>
                        <span id="stat-count" class="text-lg sm:text-xl font-bold text-slate-200">0</span>
                    </div>
                </div>
            </div>
        </footer>
    </div>

    <script>
        const GameState = { OFFLINE: 'OFFLINE', WAITING: 'WAITING', ACTIVE: 'ACTIVE', RESULT: 'RESULT', FALSE_START: 'FALSE_START' };

        let currentState = GameState.OFFLINE;
        let startTime = 0;
        let timerTimeout = null;
        let sessionData = { attempts: [], best: Infinity, count: 0 };

        const trigger = document.getElementById('game-trigger');
        const currentTimeDisplay = document.getElementById('current-time');
        const ratingLabel = document.getElementById('rating-label');
        const statAvg = document.getElementById('stat-avg');
        const statBest = document.getElementById('stat-best');
        const statCount = document.getElementById('stat-count');
        const startBtn = document.getElementById('start-btn');
        const resetSessionBtn = document.getElementById('reset-session-btn');
        const instructionOverlay = document.getElementById('instruction-overlay');
        const closeInstructions = document.getElementById('close-instructions');
        const errorFeedback = document.getElementById('error-feedback');
        const scoreModule = document.getElementById('score-module');

        let scene, camera, renderer, object;

        function init3D() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.5));
            const pLight = new THREE.PointLight(0xffffff, 1.5);
            pLight.position.set(5, 5, 5);
            scene.add(pLight);

            object = new THREE.Mesh(
                new THREE.IcosahedronGeometry(2.2, 0),
                new THREE.MeshPhongMaterial({ color: 0x1E293B, flatShading: true, shininess: 30 })
            );
            
            // Adjust position based on screen width
            updateObjectPosition();
            scene.add(object);

            const wire = new THREE.Mesh(
                new THREE.IcosahedronGeometry(2.3, 0),
                new THREE.MeshBasicMaterial({ color: 0x334155, wireframe: true, transparent: true, opacity: 0.1 })
            );
            object.add(wire);

            camera.position.z = 7;
            animate();
        }

        function updateObjectPosition() {
            if (object) {
                // On mobile (width < 640), move it down towards the center (0.5)
                // On desktop, keep it elevated (1.8)
                object.position.y = window.innerWidth < 640 ? 0.6 : 1.8;
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            if (object) {
                let rotSpeed = 0;
                if (currentState !== GameState.OFFLINE) {
                    rotSpeed = (currentState === GameState.WAITING) ? 0.08 : 0.01;
                }
                
                object.rotation.x += rotSpeed;
                object.rotation.y += rotSpeed * 1.2;
                
                if (currentState === GameState.WAITING) {
                    const s = 1 + Math.sin(Date.now() * 0.02) * 0.1;
                    object.scale.set(s, s, s);
                } else {
                    object.scale.set(1, 1, 1);
                }
            }
            renderer.render(scene, camera);
        }

        function getRating(ms) {
            if (ms < 180) return { label: "Elite", color: "#10B981" };
            if (ms < 220) return { label: "Pro", color: "#34D399" };
            if (ms < 270) return { label: "Great", color: "#60A5FA" };
            return { label: "Average", color: "#94A3B8" };
        }

        function updateVisualState() {
            errorFeedback.style.opacity = "0";
            scoreModule.classList.remove('pulse-error');

            switch (currentState) {
                case GameState.OFFLINE:
                    object.material.color.setHex(0x1E293B);
                    startBtn.innerText = "START GAME";
                    trigger.style.display = "none";
                    break;
                case GameState.WAITING:
                    object.material.color.setHex(0xF59E0B);
                    ratingLabel.innerText = "WAITING...";
                    ratingLabel.style.color = "#F59E0B";
                    startBtn.innerText = "ABORT";
                    trigger.style.display = "block";
                    break;
                case GameState.ACTIVE:
                    object.material.color.setHex(0x10B981);
                    ratingLabel.innerText = "REACT!";
                    ratingLabel.style.color = "#10B981";
                    break;
                case GameState.RESULT:
                    object.material.color.setHex(0x3B82F6);
                    startBtn.innerText = "NEXT CYCLE";
                    break;
                case GameState.FALSE_START:
                    object.material.color.setHex(0xEF4444);
                    errorFeedback.style.opacity = "1";
                    ratingLabel.innerText = "INVALID";
                    ratingLabel.style.color = "#EF4444";
                    scoreModule.classList.add('pulse-error');
                    startBtn.innerText = "RETRY";
                    break;
            }
        }

        function startGameCycle() {
            if (timerTimeout) clearTimeout(timerTimeout);
            currentState = GameState.WAITING;
            updateVisualState();
            timerTimeout = setTimeout(() => {
                currentState = GameState.ACTIVE;
                startTime = performance.now();
                updateVisualState();
            }, 1000 + Math.random() * 4000);
        }

        function handleTrigger() {
            if (currentState === GameState.OFFLINE) return;

            if (currentState === GameState.WAITING) {
                clearTimeout(timerTimeout);
                currentState = GameState.FALSE_START;
                updateVisualState();
            } else if (currentState === GameState.ACTIVE) {
                const reactionTime = Math.round(performance.now() - startTime);
                const rating = getRating(reactionTime);
                currentState = GameState.RESULT;
                currentTimeDisplay.innerText = reactionTime;
                currentTimeDisplay.style.color = rating.color;
                ratingLabel.innerText = rating.label;
                ratingLabel.style.color = rating.color;
                saveAttempt(reactionTime);
                updateVisualState();
            }
        }

        function saveAttempt(time) {
            sessionData.attempts.push(time);
            sessionData.count++;
            if (time < sessionData.best) sessionData.best = time;
            const avg = Math.round(sessionData.attempts.reduce((a, b) => a + b, 0) / sessionData.attempts.length);
            statCount.innerText = sessionData.count;
            statBest.innerText = (sessionData.best === Infinity) ? "--" : sessionData.best;
            statAvg.innerText = avg;
        }

        function toggleEngine() {
            if (currentState === GameState.OFFLINE || currentState === GameState.RESULT || currentState === GameState.FALSE_START) {
                startGameCycle();
            } else {
                clearTimeout(timerTimeout);
                currentState = GameState.OFFLINE;
                updateVisualState();
            }
        }

        function resetSession() {
            sessionData = { attempts: [], best: Infinity, count: 0 };
            statCount.innerText = "0";
            statBest.innerText = "--";
            statAvg.innerText = "--";
            currentTimeDisplay.innerText = "--";
            currentTimeDisplay.style.color = "";
            ratingLabel.innerText = "Standby";
            ratingLabel.style.color = "";
            currentState = GameState.OFFLINE;
            clearTimeout(timerTimeout);
            updateVisualState();
        }

        closeInstructions.addEventListener('click', () => { instructionOverlay.classList.add('hidden'); });
        startBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleEngine(); });
        resetSessionBtn.addEventListener('click', (e) => { e.stopPropagation(); resetSession(); });
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            updateObjectPosition();
        });

        trigger.addEventListener('mousedown', (e) => { e.preventDefault(); handleTrigger(); });
        trigger.addEventListener('touchstart', (e) => { e.preventDefault(); handleTrigger(); });

        window.onload = init3D;
    </script>
</body>
</html>
